service: kortuli-bot
image: qelphybox/kortuli-bot

# There is no "web" role to be primary, so say which role is. Kamal would
# otherwise look for one called "web" and refuse to start. The primary role is
# the one that would normally get a proxy, which is exactly why `proxy: false`
# below is load-bearing rather than decorative: this process has no port and
# serves nothing.
primary_role: bot
servers:
  bot:
    hosts:
      - 204.168.193.130
    cmd: bundle exec bin/bot
    proxy: false

registry:
  server: ghcr.io
  username: qelphybox
  password:
    - KAMAL_REGISTRY_PASSWORD

# The VPS is x86_64 while the machine building this is arm64, so the build is
# cross-platform and needs a buildx builder rather than plain `docker build`.
builder:
  arch: amd64

# The SQLite file is the only state that must outlive a container. It is a bind
# mount rather than a named volume so `data/booking.db` can be copied off the
# host with scp, the way the README says to back it up. The directory has to
# exist on the host and be owned by uid 1000 before the first deploy — see
# "Deploying" in the README.
volumes:
  - "/srv/kortuli-bot/data:/app/data"

env:
  clear:
    DATABASE_URL: sqlite://data/booking.db
  secret:
    - TELEGRAM_TOKEN
    - OWNER_TELEGRAM_ID
    - CONTACT_EMAIL

# The log is the health check, so keep enough of it to see a night's polling.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

# A deploy runs the new container alongside the old for a few seconds. Telegram
# permits one long-poller per token and answers the loser with 409, so the new
# process waits the conflict out rather than dying — see Telegram::Runner. This
# is the readiness window it waits through.
readiness_delay: 5
deploy_timeout: 60

# Nothing here needs a database container or a key-value store: one process,
# one file.
