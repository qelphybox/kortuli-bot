# Clubs are mirrored into the database on every boot, so this file is the
# source of truth. Nothing here is secret: Reservio's ids are public.
#
# To add another Reservio club:  bundle exec rake "discover:reservio[subdomain]"
#
# Removing an entry disables that club on the next boot; its row stays.
#
# Not here on purpose: padel-club2.reservio.com ("Padel Club 2") is GymBreeze
# Ninoshvili's own Reservio page — the same courts, read twice. Dropped
# 2026-10-13; gymbreeze-ninoshvili is the one we watch.

- slug: kus-tba-padel
  name: Kus Tba Padel
  adapter: kustba
  enabled: true
  poll_interval_seconds: 240
  settings:
    booking_url: "https://kustbapadel.ge/book/"
    # The club's page on sapadelo.com, where its Profile comes from — see
    # config/club_profiles.yml and `rake sapadelo:import`.
    sapadelo: kus-tba-padel
    price: "80 GEL"
    # Books until 02:00, so the day runs past midnight and the last hour anyone
    # can start is 01:00.
    opening_hours:
      from: "08:00"
      to: "02:00"
    # The booking widget's own max_days. The API answers past it, but nothing
    # out there is bookable yet, so everything reads free and never changes.
    max_days: 7
    # This adapter reports availability per hour, not per court — nothing to
    # alias.
    court_aliases: {}

# GymBreeze runs two sites at opposite ends of town, so they are two clubs
# rather than one: a watcher wanting Radio City is not served by Ninoshvili.
# Both share one backend, told apart by location_id.
- slug: gymbreeze-ninoshvili
  name: GymBreeze Ninoshvili
  adapter: gymbreeze
  enabled: true
  poll_interval_seconds: 240
  settings:
    location_id: "63f663fa-1852-5bde-bf94-dee5b176de1d"
    sapadelo: gymbreeze-ninoshvili
    booking_url: "https://gymbreeze.ge/eng"
    # Varies by hour and weekday (60 before 11:00, 40 midday, 60 after 18:00).
    # The rates are published at /facilities/locations/<id>/ if this is ever
    # worth computing per slot rather than printing as a range.
    price: "40–60 GEL"
    # Their own working_hours say 08:00–01:00 every day, both locations.
    opening_hours:
      from: "08:00"
      to: "01:00"
    # Dates the club's own widget offers, counting today. The API answers well
    # past it, reporting whole days free because nothing out there is bookable.
    max_days: 8
    # Availability is reported per hour, not per court — nothing to alias.
    court_aliases: {}

- slug: gymbreeze-radio-city
  name: GymBreeze Radio City
  adapter: gymbreeze
  enabled: true
  poll_interval_seconds: 240
  settings:
    location_id: "752155d7-39aa-53d9-bc18-682695f85244"
    sapadelo: gymbreeze-radio-city
    booking_url: "https://gymbreeze.ge/eng"
    price: "30–40 GEL"
    opening_hours:
      from: "08:00"
      to: "01:00"
    max_days: 8
    court_aliases: {}

# The third site, at the Sports Palace on 26 May Square. It sat in the backend
# from July and started selling by October; same API, same window, Ninoshvili's
# prices.
- slug: gymbreeze-sport-palace
  name: GymBreeze Sport Palace
  adapter: gymbreeze
  enabled: true
  poll_interval_seconds: 240
  settings:
    location_id: "7a896411-0c3a-5336-a522-a6da08b6132c"
    sapadelo: gymbreeze-sports-palace
    booking_url: "https://gymbreeze.ge/eng"
    price: "40–60 GEL"
    opening_hours:
      from: "08:00"
      to: "01:00"
    max_days: 8
    court_aliases: {}

# Padelbade runs on Book & Go. One request returns every club of the tenant, so
# these two share an adapter and are told apart by location_id — the same shape
# as the two GymBreeze sites. The tenant also holds Padelbade Rustavi (location
# 142), deliberately left out: another city, and the app has no notion of one.
- slug: padelbade-krtsanisi
  name: Padelbade Krtsanisi
  adapter: bookandgo
  enabled: true
  poll_interval_seconds: 240
  settings:
    location_id: 163
    sapadelo: padelbade-krtsanisi
    booking_url: "https://app.padelbade.com/"
    price: "80 GEL"
    # Declared, as every club's hours are — but derived from an observation
    # rather than a published schedule, because the platform publishes none
    # (a timing's `start_time`/`end_time` are a flat 00:00–24:00 and say
    # nothing about when the club is open). This is the span of starts the
    # feed offers on a date far enough out that nothing is booked yet:
    # last start 00:00, so the club shuts at 01:00.
    opening_hours:
      from: "08:00"
      to: "01:00"
    # The longest per-court `app_bookable_days_in_future` here: two courts run
    # to 29–30 while the other three stop at 22. Capping at the shortest would
    # never poll the best courts' last week. Overshooting costs nothing —
    # past a court's own window the feed returns an empty list of starts
    # rather than phantom free ones. Counts today, so 30 reaches D+29.
    max_days: 30
    # The source names its courts, so a cell here can say how many of the five
    # are free.
    courts: 5
    # Court ids are stable integers, so there is nothing to alias.
    court_aliases: {}

- slug: padelbade-dighomi
  name: Padelbade Dighomi
  adapter: bookandgo
  enabled: true
  poll_interval_seconds: 240
  settings:
    location_id: 141
    sapadelo: padelbade-dighomi
    booking_url: "https://app.padelbade.com/"
    price: "80 GEL"
    # Offers a 01:00 start, so this one is declared an hour later than
    # Krtsanisi.
    opening_hours:
      from: "08:00"
      to: "02:00"
    # `app_bookable_days_in_future` is 14 for both courts here, and the count
    # includes today.
    max_days: 15
    courts: 2
    court_aliases: {}

# PadelHub reads through Supabase with the anon key its own site ships; the
# adapter carries it. Courts come from the source every tick — a third one
# opened in October 2026 — so nothing here pins them.
- slug: padelhub
  name: PadelHub
  adapter: padelhub
  enabled: true
  poll_interval_seconds: 240
  settings:
    booking_url: "https://www.padelhub.ge/booking"
    sapadelo: padelhub
    # 40 for starts up to 14:00, then the court's own evening price: 60
    # outdoors, 70 under the roof.
    price: "40–70 GEL"
    # The site's grid, hard-coded client-side: 08:00 to a last start at 00:00.
    opening_hours:
      from: "08:00"
      to: "01:00"
    # No upper bound on the club's own picker; see the adapter.
    max_days: 14
    courts: 3
    # Court names arrive as i18n keys. "open" is the outdoor court.
    court_labels:
      court_padel_open: "Outdoor"
      court_padel_closed: "Indoor 1"
      court_padel_closed_2: "Indoor 2"
    court_aliases: {}

# Padel Academy shows its schedule only after a login, so this club polls as a
# member: PADEL_ACADEMY_EMAIL and PADEL_ACADEMY_PASSWORD in the environment.
# Without them it fails its tick and says so; nothing else is affected.
- slug: padel-academy
  name: Padel Academy
  adapter: padelacademy
  enabled: true
  poll_interval_seconds: 240
  settings:
    booking_url: "https://booking.padelacademy.ge/"
    sapadelo: padel-academy
    price: "80 GEL"
    # Last start 01:00, filed by the source under the date before.
    opening_hours:
      from: "08:00"
      to: "02:00"
    max_days: 14
    # Courts 1–3, hard-coded in the club's client. The adapter asks each by
    # number, so this is also how many it asks about.
    courts: 3
    court_aliases: {}

# Lemans Padel books through its own PHP API on a subdomain of the WordPress
# site, open to anyone. The adapter reads the court list from it every tick,
# so nothing here pins the courts.
- slug: lemans-padel
  name: Lemans Padel
  adapter: lemans
  enabled: true
  poll_interval_seconds: 240
  settings:
    booking_url: "https://lemanspadel.ge/book-padel/"
    sapadelo: lemans-padel
    # 50 for weekday starts before 17:00, 70 evenings and weekends; the same
    # on every court. The court list's `duration_prices` says a flat 70 — the
    # real rate is per start, from /availability/courts.
    price: "50–70 GEL"
    # Starts run 08:00 to a last one at 01:00, which the source dates to the
    # morning after.
    opening_hours:
      from: "08:00"
      to: "02:00"
    # No window on the server or in the widget's picker: a date a year out
    # reads entirely free. Two weeks, as for PadelHub.
    max_days: 14
    # The source answers per court, so a cell can say how many of the four are
    # free.
    courts: 4
    court_aliases: {}
