# 2026-10-13. The site publishes no hours, so these are the span of starts its
# own feed offers, as for Padelbade.
- slug: tbilisi-padel-didi-dighomi
  name: Tbilisi Padel Didi Dighomi
  adapter: bookingpress
  enabled: true
  poll_interval_seconds: 240
  settings:
    city: Tbilisi
    service_id: 6
    sapadelo: tbilisi-padel-didi-dighomi
    booking_url: "https://tbilisipadel.ge/en/"
    price: "60 GEL"
    # Last start 01:00, sold under the date before — unlike the other two
    # locations, which shut at midnight.
    opening_hours:
      from: "09:00"
      to: "02:00"
    # The form offers a year ahead and the server answers for all of it with
    # empty courts. Bookings reached five days out; two weeks, as for Lemans.
    max_days: 14
    # The doubles service's `max_capacity`. The source says how many are free
    # each hour, never which, so a cell can say "3 of 4" and a notification
    # says "a court". The site's fifth court here is a 1-vs-1 court, sold as
    # its own service (5) at 50 GEL — a different game, not watched.
    courts: 4
