name: Deploy

# Every push to main ships, provided the specs pass. The run is the same
# `kamal deploy` the README describes, from a runner instead of a laptop —
# which also retires the cross-build: the runner is amd64, like the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Kamal takes a lock on the server, and a second deploy racing for it fails
# rather than waits. Queue runs here instead, and never cancel one half-way:
# a deploy killed mid-flight leaves that lock behind (`kamal lock release`).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Matches RUBY_VERSION in the Dockerfile: the specs should run on the
      # Ruby that production runs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.0"
          bundler-cache: true

      - run: bundle exec rspec

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    # The names .kamal/secrets reads from the environment.
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      # An unset secret reaches Kamal as an empty string, not an error, and
      # the deploy then fails much later and much less legibly — or worse,
      # succeeds with a bot that cannot log in. Refuse up front instead.
      - name: Check secrets are set
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in KAMAL_REGISTRY_PASSWORD TELEGRAM_TOKEN CONTACT_EMAIL SESSION_SECRET SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.0"
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned rather than ssh-keyscan'd: a scan on every run would trust
      # whatever answers at that address. Kamal's net-ssh honours this file,
      # and .kamal/hooks/pre-deploy needs it outright — its plain `ssh` runs
      # in BatchMode and refuses an unknown host.
      - name: Trust the server's host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # `setup` rather than `deploy`: it is `deploy` preceded by a bootstrap
      # that installs Docker only where it is missing, so on a server that
      # already has it the extra cost is one `docker -v`. In exchange a fresh
      # server needs nothing done to it by hand beyond the SSH key.
      - run: bundle exec kamal setup
